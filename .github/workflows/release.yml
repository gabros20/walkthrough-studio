name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Tag matches the manifests
        run: |
          tag="${GITHUB_REF_NAME#v}"
          current="$(node scripts/version.mjs --current)"
          if [ "$tag" != "$current" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the manifest version $current. Run scripts/version.mjs first."
            exit 1
          fi
          node scripts/version.mjs --verify

      - name: Release notes from docs/CHANGELOG.md
        run: node scripts/version.mjs --notes "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag $prerelease
