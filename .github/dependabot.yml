version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /recorder
    schedule:
      interval: weekly
    groups:
      playwright:
        patterns: ["playwright*"]
  - package-ecosystem: npm
    directory: /film
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    groups:
      next-react:
        patterns: ["next", "react", "react-dom", "@types/react", "@types/react-dom"]
      tailwind:
        patterns: ["tailwindcss", "@tailwindcss/*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
