name: Feature request
description: Suggest a change or a new capability.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Check `docs/ROADMAP.md` first: it lists what is planned and not built.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to make or do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
      description: The change you would like. Commands, config keys or output you would expect are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you tried, or other ways to solve it.
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would like to open a pull request for this.
